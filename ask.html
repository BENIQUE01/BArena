<div class="page-head"><div class="wrap"><h1>Ask us anything.</h1><p>Send a question, a suggestion or a bug report. We answer publicly so others can learn too.</p></div></div><div class="pg"><div class="wrap"><form class="ask" id="f"><input name="name" placeholder="Your name (optional)" maxlength="60"><select name="kind"><option>Question</option><option>Suggestion</option><option>Bug report</option></select><textarea name="question" rows="5" placeholder="What would you like to know?" required minlength="8" maxlength="1000"></textarea><button class="btn" type="submit">Send</button><p class="note" id="status" role="status"></p></form><h2 style="margin:70px 0 10px;font-size:2rem">Answered questions</h2><div id="answers"></div></div></div><footer><div class="wrap"><div>&copy; 2026 Barena Hub. Every sport. Everywhere.</div><div><a href="privacy.html">Privacy</a><a href="ask.html">Ask us</a><a href="https://github.com/BENIQUE01/barenahub-app/releases/latest">Download</a></div></div></footer><script>document.getElementById('tg').onclick=function(){var r=document.documentElement,c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=c=='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('bh-theme',n)}catch(e){}}</script><script>(function(){var n=document.querySelector('.nav'),b=document.getElementById('mb');b.onclick=function(){var o=n.classList.toggle('open');b.setAttribute('aria-expanded',o);b.innerHTML=o?'&times;':'&#9776;'};n.querySelectorAll('nav a').forEach(function(l){l.onclick=function(){n.classList.remove('open');b.innerHTML='&#9776;'}})})()</script><script src="assets/js/config.js"></script><script>
const C=window.BARENA_QA,H={apikey:C.anonKey,Authorization:"Bearer "+C.anonKey,"Content-Type":"application/json"},E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),L=document.getElementById("answers"),S=document.getElementById("status");
async function load(){if(!C.url){L.innerHTML='<p class="note">Answers will appear here soon.</p>';return}
try{const r=await fetch(C.url+"/rest/v1/questions?answered=eq.true&select=question,answer&order=created_at.desc&limit=50",{headers:H});const d=await r.json();L.innerHTML=d.length?d.map(q=>`<details class="qa"><summary>${E(q.question)}</summary><p>${E(q.answer)}</p></details>`).join(""):'<p class="note">No answered questions yet. Be the first to ask.</p>'}catch(e){L.innerHTML='<p class="note">Could not load answers right now.</p>'}}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const f=e.target;if(!C.url){S.textContent="Q&A is being set up. Please check back soon.";return}
S.textContent="Sending...";try{const r=await fetch(C.url+"/rest/v1/questions",{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify({name:f.name.value.trim()||null,kind:f.kind.value,question:f.question.value.trim()})});if(!r.ok)throw 0;f.reset();S.textContent="Thanks! We read every message and publish answers here."}catch(x){S.textContent="Could not send. Please try again."}};load()</script></body></html>
