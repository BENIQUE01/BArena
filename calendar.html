<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar — BArena</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/calendar.css">

</head>
<body class="calendar-page">

<nav>
  <div class="brand">BAR<span>ENA</span></div>
  <div class="navlinks">
    <a href="index.html">Home</a>
    <a href="features.html">Features</a>
    <a href="tournaments.html">Tournaments</a>
    <a href="calendar.html">Calendar</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
  </div>
  <button class="nav-cta" onclick="document.getElementById('appModal').classList.add('open')" style="border:none; cursor:pointer; font-family:inherit;">Register</button>
</nav>

<div class="page-hero">
  <h1>Event <span>Calendar</span></h1>
  <p>All BArena events across counties and editions, grouped by month.</p>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="upcoming">Upcoming & Live</button>
  <button class="tab-btn" data-tab="past">Past Events</button>
</div>

<div class="timeline" id="timeline">
  <div class="skeleton-row"></div>
  <div class="skeleton-row"></div>
  <div class="skeleton-row"></div>
</div>

<script>
  const SUPABASE_URL  = 'https://xtbvzdupauxuxchhmshd.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0YnZ6ZHVwYXV4dXhjaGhtc2hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzA0ODgsImV4cCI6MjA5MzcwNjQ4OH0.M9nqtyVj0YCH1v3P0cJ2OfHBHyH4tn0BReNDWWalTlo';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON);

  let allEvents = [];
  let activeTab = 'upcoming';

  async function loadEvents() {
    const { data: events, error } = await db
      .from('tournaments')
      .select('id, name, slug, status, start_date, end_date, venue, sport_id, institution_id')
      .eq('is_public', true)
      .not('start_date', 'is', null)
      .order('start_date', { ascending: false });

    if (error) { renderError(); return; }

    // Count confirmed entries per tournament via categories
    const { data: regCounts } = await db
      .from('category_entries')
      .select('category_id, categories!inner(tournament_id)')
      .eq('payment_status', 'confirmed');

    // Map tournament_id → count
    const countMap = {};
    if (regCounts) {
      regCounts.forEach(r => {
        const tid = r.categories?.tournament_id;
        if (tid) countMap[tid] = (countMap[tid] || 0) + 1;
      });
    }

    allEvents = (events || []).map(e => ({
      ...e,
      total_registrations: countMap[e.id] || 0
    }));

    render();
  }

  function render() {
    const tl = document.getElementById('timeline');
    const isUpcoming = activeTab === 'upcoming';

    const filtered = allEvents.filter(e =>
      isUpcoming
        ? (e.status === 'upcoming' || e.status === 'ongoing')
        : e.status === 'completed'
    );

    if (filtered.length === 0) {
      tl.innerHTML = `
        <div class="empty-state">
          <div class="icon">📅</div>
          <h3>No ${isUpcoming ? 'upcoming' : 'past'} events</h3>
          <p>${isUpcoming ? 'Check back soon — new tournaments are added regularly.' : 'Past events will appear here once they conclude.'}</p>
        </div>`;
      return;
    }

    // Group by month
    const groups = {};
    filtered.forEach(e => {
      const d = new Date(e.start_date || Date.now());
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const label = d.toLocaleDateString('en-KE', { month: 'long', year: 'numeric' });
      if (!groups[key]) groups[key] = { label, events: [] };
      groups[key].events.push(e);
    });

    const sortedKeys = Object.keys(groups).sort((a, b) => isUpcoming ? a.localeCompare(b) : b.localeCompare(a));

    tl.innerHTML = sortedKeys.map(key => {
      const { label, events } = groups[key];
      return `
        <div class="month-group">
          <div class="month-header">
            <span class="month-label">${label}</span>
            <div class="month-line"></div>
          </div>
          ${events.map(e => rowHTML(e)).join('')}
        </div>`;
    }).join('');
  }

  function rowHTML(e) {
    const d = new Date(e.start_date || Date.now());
    const day = d.getDate();
    const mon = d.toLocaleDateString('en-KE', { month: 'short' });
    const statusClass = `pill-${e.status}`;
    const statusLabel = e.status === 'upcoming' ? 'Upcoming'
                      : e.status === 'ongoing'  ? 'Live'
                      : 'Completed';
   const href = e.slug === 'banana-smash-s04' ? 'kiambu/s04/index.html'
               : e.slug === 'banana-smash-s2-1782044002661' ? 'kiambu/s02/index.html'
               : '#';

    return `
    <a class="event-row" href="${href}">
      <div class="event-date">
        <div class="day">${day}</div>
        <div class="mon">${mon}</div>
      </div>
      <div class="event-info">
        <h3>${e.name || 'Tournament'}</h3>
        <div class="event-meta">
          ${e.venue ? `<span>📍 ${e.venue}${e.county ? ', ' + e.county : ''}</span>` : ''}
          ${e.sport ? `<span>🏆 ${e.sport}</span>` : ''}
          ${e.edition ? `<span>📌 ${e.edition}${e.season_number ? ' S' + e.season_number : ''}</span>` : ''}
        </div>
      </div>
      <div class="event-right">
        <span class="status-pill ${statusClass}">
          <div class="pill-dot"></div>${statusLabel}
        </span>
        <span class="reg-count"><strong>${e.total_registrations}</strong> registered</span>
      </div>
    </a>`;
  }

  function renderError() {
    document.getElementById('timeline').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <h3>Couldn't load events</h3>
        <p>Check your Supabase credentials.</p>
      </div>`;
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      render();
    });
  });

  loadEvents();
</script>

<div class="app-modal-overlay" id="appModal">
  <div class="app-modal">
    <button class="app-modal-close" onclick="document.getElementById('appModal').classList.remove('open')">✕</button>
    <h2>Get the <span style="color:var(--accent)">BArena</span> App</h2>
    <p class="sub">Every sport. Every tournament. Everywhere.</p>

    <div class="app-slider" id="appSlider">
      <div class="app-slide active"><img src="assets/images/app-screens/app-01.png" alt="BArena app preview"/></div>
      <div class="app-slide"><img src="assets/images/app-screens/app-02.png" alt="BArena app preview"/></div>
      <div class="app-slide"><img src="assets/images/app-screens/app-03.png" alt="BArena app preview"/></div>
      <div class="app-slide"><img src="assets/images/app-screens/app-04.png" alt="BArena app preview"/></div>
      <div class="app-slide"><img src="assets/images/app-screens/app-05.png" alt="BArena app preview"/></div>
      <div class="app-slide"><img src="assets/images/app-screens/app-06.png" alt="BArena app preview"/></div>
      <div class="app-slide"><img src="assets/images/app-screens/app-07.png" alt="BArena app preview"/></div>
      <div class="app-slide"><img src="assets/images/app-screens/app-08.png" alt="BArena app preview"/></div>
      <div class="app-slide"><img src="assets/images/app-screens/app-09.png" alt="BArena app preview"/></div>
      <div class="app-slide"><img src="assets/images/app-screens/app-10.png" alt="BArena app preview"/></div>
      <button class="app-slider-nav app-slider-prev" onclick="appSlide(-1)">‹</button>
      <button class="app-slider-nav app-slider-next" onclick="appSlide(1)">›</button>
    </div>

    <div class="app-dots" id="appDots"></div>

    <div class="app-modal-cta">📱 Download link coming soon</div>
  </div>
</div>

<script>
(function() {
  let appCurrent = 0;
  const appSlides = document.querySelectorAll('#appSlider .app-slide');
  const appDotsEl = document.getElementById('appDots');
  appSlides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'app-dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => appGoTo(i);
    appDotsEl.appendChild(dot);
  });
  window.appSlide = function(dir) {
    appGoTo((appCurrent + dir + appSlides.length) % appSlides.length);
  };
  function appGoTo(i) {
    appSlides[appCurrent].classList.remove('active');
    appDotsEl.children[appCurrent].classList.remove('active');
    appCurrent = i;
    appSlides[appCurrent].classList.add('active');
    appDotsEl.children[appCurrent].classList.add('active');
  }
})();
</script>
</body>
</html>
