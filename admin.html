<header class="nav"><div class="wrap"><a class="brand" href="index.html"><img src="assets/img/logo.png" alt="">Barena Hub</a><nav><a href="index.html">Home</a><a href="features.html">Features</a><a href="tournaments.html">Tournaments</a><a href="watch.html">Live</a><a href="gallery.html">Gallery</a><a href="blog.html">Blog</a><a href="ask.html">Q&amp;A</a><a href="about.html">About</a><a class="navget" href="index.html#get">Get the app</a></nav><button class="tg" id="tg" type="button" aria-label="Switch light or dark theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button><a class="btn" href="index.html#get">Get the app</a><button class="mb" id="mb" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button></div></header>
<style>.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.sg>div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.sg b{display:block;font:800 2rem 'Bricolage Grotesque',system-ui,sans-serif}.sg span{color:var(--mute);font-size:.85rem}.bars{display:flex;align-items:flex-end;gap:3px;height:150px;margin:20px 0 6px}.bars i{flex:1;background:var(--copper);border-radius:3px 3px 0 0;min-height:2px}.al{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.ar{position:relative;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;margin-top:6px;border-radius:8px;overflow:hidden}.ar i{position:absolute;inset:0 auto 0 0;background:rgba(196,105,31,.18)}.ar span,.ar b{position:relative}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:22px}.pr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.pr textarea{width:100%;font:inherit;margin:8px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.dl{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--mute);font:inherit}.rg{display:flex;gap:8px;margin-bottom:20px}.rg button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:8px 18px;cursor:pointer;font:inherit}.rg .on{background:var(--navy);color:#fff}.tabs{flex-wrap:wrap;border-radius:22px}</style><div class="page-head"><div class="wrap"><h1>Site admin</h1><p>Photos, posts, questions and visitor stats.</p></div></div><div class="pg"><div class="wrap" id="root"><p class="note">Loading...</p></div></div><footer><div class="wrap"><div>&copy; 2026 Barena Hub. Every sport. Everywhere.</div><div><a href="privacy.html">Privacy</a><a href="ask.html">Ask us</a><a href="https://github.com/BENIQUE01/barenahub-app/releases/latest">Download</a></div></div></footer><script>document.getElementById('tg').onclick=function(){var r=document.documentElement,c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=c=='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('bh-theme',n)}catch(e){}}</script><script>(function(){var n=document.querySelector('.nav'),b=document.getElementById('mb');b.onclick=function(){var o=n.classList.toggle('open');b.setAttribute('aria-expanded',o);b.innerHTML=o?'&times;':'&#9776;'};n.querySelectorAll('nav a').forEach(function(l){l.onclick=function(){n.classList.remove('open');b.innerHTML='&#9776;'}})})()</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const C=window.BARENA_QA,sb=supabase.createClient(C.url,C.anonKey),$=id=>document.getElementById(id),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{localStorage.setItem("bh-notrack","1")}catch(e){}
const shrink=f=>new Promise((res,rej)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej("Could not read image"),"image/jpeg",.82)};i.onerror=()=>rej("Unsupported image");i.src=u});
const up=async(blob,path)=>{const r=await sb.storage.from("site-media").upload(path,blob,{contentType:"image/jpeg"});if(r.error)throw r.error;return sb.storage.from("site-media").getPublicUrl(path).data.publicUrl};
async function boot(){const{data}=await sb.auth.getSession();data.session?app():login()}
function login(m){$("root").innerHTML=`<form class="ask" id="lf" style="max-width:420px"><h2 style="font-size:1.8rem">Admin sign in</h2><input name="e" type="email" placeholder="Email" required autocomplete="username"><input name="p" type="password" placeholder="Password" required autocomplete="current-password"><button class="btn" type="submit">Sign in</button><p class="note">${m||""}</p></form>`;$("lf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:e.target.e.value,password:e.target.p.value});error?login("Sign in failed: "+E(error.message)):app()}}
function app(){$("root").innerHTML='<div class="tabs" id="at"><button data-t="dash" class="on">Dashboard</button><button data-t="photos">Photos</button><button data-t="posts">Posts</button><button data-t="qs">Questions</button><button id="so">Sign out</button></div><div id="pane" style="margin-top:28px"></div>';
$("at").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id=="so"){sb.auth.signOut().then(()=>login());return}[...$("at").children].forEach(x=>x.classList.toggle("on",x==b));show(b.dataset.t)};show("dash")}
function show(t){$("pane").onclick=null;({dash,photos,posts,qs})[t]()}
const CT={"Africa/Nairobi":"Kenya","Africa/Kampala":"Uganda","Africa/Dar_es_Salaam":"Tanzania","Africa/Lagos":"Nigeria","Africa/Accra":"Ghana","Africa/Johannesburg":"South Africa","Africa/Addis_Ababa":"Ethiopia","Africa/Cairo":"Egypt","Europe/London":"United Kingdom","America/New_York":"United States","America/Chicago":"United States","America/Los_Angeles":"United States","Asia/Dubai":"UAE","Asia/Kolkata":"India"};
async function dash(days){days=days||30;const P=$("pane");P.innerHTML='<p class="note">Loading...</p>';const since=new Date(Date.now()-days*864e5).toISOString();let rows=[],from=0;
for(;;){const{data,error}=await sb.from("site_visits").select("created_at,vid,path,ref,device,tz,lang,utm,is_new").gte("created_at",since).order("created_at",{ascending:true}).range(from,from+999);if(error){P.innerHTML="<p>Could not load visits: "+E(error.message)+". Did you run the SQL setup and sign in with the admin email?</p>";return}rows=rows.concat(data);if(data.length<1000||rows.length>=30000)break;from+=1000}
const dk=d=>new Date(d).toLocaleDateString("en-CA"),byDay={},V={},NW=new Set;let sess=0,bounce=0;
rows.forEach(r=>{byDay[dk(r.created_at)]=(byDay[dk(r.created_at)]||0)+1;(V[r.vid]=V[r.vid]||[]).push(r);if(r.is_new)NW.add(r.vid)});
Object.values(V).forEach(a=>{let cur=0,last=0;a.forEach(r=>{const t=+new Date(r.created_at);if(!last||t-last>18e5){if(cur==1)bounce++;sess++;cur=0}cur++;last=t});if(cur==1)bounce++});
const uniq=Object.keys(V).length,now=Date.now(),liveN=new Set(rows.filter(r=>now-new Date(r.created_at)<3e5).map(r=>r.vid)).size,today=byDay[dk(now)]||0;
const days_=[];for(let i=days-1;i>=0;i--)days_.push(dk(now-i*864e5));const mx=Math.max(1,...days_.map(d=>byDay[d]||0));
const hrs=Array(24).fill(0);rows.forEach(r=>hrs[new Date(r.created_at).getHours()]++);const hm=Math.max(1,...hrs);
const top=(f,n)=>{const m={};rows.forEach(r=>{const k=f(r)||"(direct or unknown)";m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n||8)};
const bl=(t,l)=>{const m=Math.max(1,...l.map(x=>x[1]));return`<div class="al"><h3>${t}</h3>${l.map(([k,v])=>`<div class="ar"><i style="width:${v/m*100}%"></i><span>${E(k)}</span><b>${v}</b></div>`).join("")||'<p class="note">No data yet.</p>'}</div>`};
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"0%";
P.innerHTML=`<div class="rg">${[7,30,90].map(n=>`<button class="${n==days?"on":""}" data-d="${n}">${n} days</button>`).join("")}</div>
<div class="sg"><div><b>${rows.length}</b><span>Page views</span></div><div><b>${uniq}</b><span>Visitors</span></div><div><b>${liveN}</b><span>Active now (5 min)</span></div><div><b>${today}</b><span>Views today</span></div><div><b>${NW.size}</b><span>New visitors</span></div><div><b>${pct(uniq-NW.size,uniq)}</b><span>Returning visitors</span></div><div><b>${sess}</b><span>Sessions</span></div><div><b>${sess?(rows.length/sess).toFixed(1):0}</b><span>Pages per session</span></div><div><b>${pct(bounce,sess)}</b><span>Bounce rate</span></div></div>
<div class="al" style="margin-top:22px"><h3>Views per day</h3><div class="bars">${days_.map(d=>`<i title="${d}: ${byDay[d]||0}" style="height:${(byDay[d]||0)/mx*100}%"></i>`).join("")}</div><p class="note">${days_[0]} to ${days_[days_.length-1]}</p></div>
<div class="g2">${bl("Top pages",top(r=>r.path))}${bl("Where visitors come from",top(r=>r.utm||r.ref))}${bl("Devices",top(r=>r.device))}${bl("Locations (by time zone)",top(r=>CT[r.tz]||r.tz))}${bl("Languages",top(r=>r.lang))}</div>
<div class="al" style="margin-top:22px"><h3>Busiest hours</h3><div class="bars">${hrs.map((v,h)=>`<i title="${h}:00 - ${v}" style="height:${v/hm*100}%"></i>`).join("")}</div><p class="note">0:00 to 23:00, your local time</p></div>`;
P.onclick=e=>{const b=e.target.closest("[data-d]");if(b)dash(+b.dataset.d)}}
async function photos(){const P=$("pane");P.innerHTML=`<form class="ask" id="pf" style="max-width:640px"><h2 style="font-size:1.6rem">Add photos</h2><select name="area"><option value="gallery">Gallery</option><option value="tournaments">Tournaments page</option><option value="about">About page</option></select><input name="cap" placeholder="Caption (optional)" maxlength="120"><input name="f" type="file" accept="image/*" multiple required><button class="btn" type="submit">Upload</button><p class="note" id="pm"></p></form><div class="gal" id="pl" style="margin-top:34px"></div>`;
async function l(){const{data}=await sb.from("site_photos").select("*").order("created_at",{ascending:false}).limit(200);$("pl").innerHTML=(data||[]).map(p=>`<figure style="margin:0 0 14px;break-inside:avoid"><img src="${E(p.url)}" alt="" style="width:100%;border-radius:12px;margin:0"><figcaption class="note">${E(p.area)}${p.caption?" - "+E(p.caption):""} <button class="dl" data-id="${p.id}" data-path="${E(p.path||"")}">Delete</button></figcaption></figure>`).join("")||'<p class="note">No photos yet.</p>'}
$("pf").onsubmit=async e=>{e.preventDefault();const f=e.target,fs=[...f.f.files];$("pm").textContent="Uploading...";let ok=0;for(const file of fs){try{const path=`${f.area.value}/${Date.now()}-${ok}.jpg`,url=await up(await shrink(file),path),r=await sb.from("site_photos").insert({area:f.area.value,caption:f.cap.value||null,url,path});if(r.error)throw r.error;ok++}catch(x){$("pm").textContent="Error: "+(x.message||x);return}}$("pm").textContent=ok+" photo(s) added.";f.reset();l()};
$("pl").onclick=async e=>{const b=e.target.closest(".dl");if(!b||!confirm("Delete this photo?"))return;if(b.dataset.path)await sb.storage.from("site-media").remove([b.dataset.path]);await sb.from("site_photos").delete().eq("id",b.dataset.id);l()};l()}
async function posts(){const P=$("pane");P.innerHTML=`<form class="ask" id="qf" style="max-width:760px"><h2 style="font-size:1.6rem" id="pt">New post</h2><input name="title" placeholder="Title" required maxlength="120"><input name="slug" placeholder="web-address-name (made from the title if empty)" maxlength="80"><input name="excerpt" placeholder="One-line summary" maxlength="200"><label class="note">Cover photo <input name="cover" type="file" accept="image/*"></label><textarea name="body" rows="12" placeholder="Write here. Leave a blank line between paragraphs. Start a line with ## for a heading." required></textarea><label><input type="checkbox" name="pub" checked style="width:auto"> Published</label><button class="btn" type="submit">Save post</button><p class="note" id="qm2"></p></form><div id="ql" style="margin-top:34px"></div>`;let cur=null,D=[];
async function l(){const{data}=await sb.from("posts").select("*").order("created_at",{ascending:false});D=data||[];$("ql").innerHTML=D.map(p=>`<div class="pr"><b>${E(p.title)}</b> <span class="note">${p.published?"Published":"Draft"} - post.html?p=${E(p.slug)}</span><br><button class="dl ed" data-s="${E(p.slug)}">Edit</button> <button class="dl rm" data-s="${E(p.slug)}">Delete</button></div>`).join("")||'<p class="note">No posts yet.</p>'}
$("qf").onsubmit=async e=>{e.preventDefault();const f=e.target,slug=(f.slug.value||f.title.value).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80);let cover=cur;try{if(f.cover.files[0])cover=await up(await shrink(f.cover.files[0]),`blog/${Date.now()}.jpg`);const r=await sb.from("posts").upsert({slug,title:f.title.value,excerpt:f.excerpt.value,body:f.body.value,cover_url:cover,published:f.pub.checked},{onConflict:"slug"});if(r.error)throw r.error;$("qm2").textContent="Saved.";f.reset();f.pub.checked=true;cur=null;$("pt").textContent="New post";l()}catch(x){$("qm2").textContent="Error: "+(x.message||x)}};
$("ql").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const p=D.find(x=>x.slug==b.dataset.s);if(b.classList.contains("rm")){if(confirm("Delete this post?")){await sb.from("posts").delete().eq("slug",p.slug);l()}}else{const f=$("qf");f.title.value=p.title;f.slug.value=p.slug;f.excerpt.value=p.excerpt||"";f.body.value=p.body||"";f.pub.checked=p.published;cur=p.cover_url;$("pt").textContent="Editing: "+p.title;scrollTo(0,0)}};l()}
async function qs(){const P=$("pane"),{data}=await sb.from("questions").select("*").order("created_at",{ascending:false}).limit(200);
P.innerHTML=(data||[]).map(q=>`<div class="pr" data-id="${q.id}"><span class="note">${E(q.kind)} - ${new Date(q.created_at).toLocaleString()}${q.name?" - "+E(q.name):""} - ${q.answered?"answered":"NEW"}</span><p><b>${E(q.question)}</b></p><textarea rows="3" placeholder="Your answer">${E(q.answer||"")}</textarea><button class="btn pa" type="button">Publish answer</button> <button class="dl" type="button">Delete</button></div>`).join("")||'<p class="note">No questions yet.</p>';
P.onclick=async e=>{const b=e.target.closest("button"),d=b&&b.closest(".pr");if(!d)return;const id=d.dataset.id;if(b.classList.contains("pa")){const a=d.querySelector("textarea").value.trim();if(!a)return;const r=await sb.from("questions").update({answer:a,answered:true}).eq("id",id);b.textContent=r.error?"Error":"Published"}else if(confirm("Delete this question?")){await sb.from("questions").delete().eq("id",id);qs()}}}
boot();
</script></body></html>
