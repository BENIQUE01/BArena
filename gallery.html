<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

<script>
  const SUPABASE_URL  = 'https://xtbvzdupauxuxchhmshd.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0YnZ6ZHVwYXV4dXhjaGhtc2hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzA0ODgsImV4cCI6MjA5MzcwNjQ4OH0.M9nqtyVj0YCH1v3P0cJ2OfHBHyH4tn0BReNDWWalTlo';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON);

  let allPhotos = [];
  let allEvents = {};
  let activeEventId = 'all';
  let lightboxPhotos = [];
  let lightboxIndex = 0;
  const expandedEvents = new Set();
  const SHOW_LIMIT = 12;

  async function loadGallery() {
    const [{ data: photos, error: pe }, { data: events }] = await Promise.all([
      db.from('event_photos').select('id, image_url, caption, tournament_id, media_type, created_at').order('created_at', { ascending: false }),
      db.from('tournaments').select('id, name, slug, status, start_date')
    ]);

    if (pe) { renderError(); return; }

    (events || []).forEach(e => { allEvents[e.id] = e; });
    allPhotos = photos || [];

    buildEventFilter();
    render();
  }

  function buildEventFilter() {
    const container = document.getElementById('event-filter');
    const eventIds = [...new Set(allPhotos.map(p => p.tournament_id).filter(Boolean))];

    eventIds.forEach(id => {
      const e = allEvents[id];
      const label = e ? (e.name || e.edition || 'Event') : 'Event';
      const btn = document.createElement('button');
      btn.className = 'event-pill';
      btn.dataset.eventId = id;
      btn.textContent = label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.event-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeEventId = id;
        render();
      });
      container.appendChild(btn);
    });

    document.querySelector('[data-event-id="all"]').addEventListener('click', () => {
      document.querySelectorAll('.event-pill').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-event-id="all"]').classList.add('active');
      activeEventId = 'all';
      render();
    });
  }

  function renderEventSection(eventId, photos) {
    const expanded = expandedEvents.has(eventId);
    const showAll = expanded || photos.length <= SHOW_LIMIT;
    const visible = showAll ? photos : photos.slice(0, SHOW_LIMIT);
    const e = allEvents[eventId];
    const eventLabel = e
      ? `${e.name || 'Event'}${e.start_date ? ' · ' + new Date(e.start_date).toLocaleDateString('en-KE', { day:'numeric', month:'short', year:'numeric' }) : ''}`
      : 'Photos';

    const itemsHtml = visible.map(p => {
      const globalIndex = lightboxPhotos.indexOf(p);
      const isVideo = p.media_type === 'video';
      return `
        <div class="photo-item ${isVideo ? 'is-video' : ''}" data-index="${globalIndex}">
          ${isVideo
            ? `<video muted loop playsinline preload="none" data-src="${p.image_url}"></video><div class="video-badge">▶</div>`
            : `<img src="${p.image_url}" alt="${p.caption || 'BArena event photo'}" loading="lazy"/>`}
          <div class="photo-overlay"><span class="photo-caption">${p.caption || ''}</span></div>
        </div>`;
    }).join('');

    const moreBtn = !showAll
      ? `<div class="load-more-wrap"><button class="load-more-btn" data-expand="${eventId}">Show ${photos.length - SHOW_LIMIT} more</button></div>`
      : '';

    return `
      <div class="gallery-event-section">
        <div class="gallery-event-label">
          <h2>${eventLabel}</h2>
          <div class="divider"></div>
          <span class="count">${photos.length} item${photos.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="masonry">${itemsHtml}</div>
        ${moreBtn}
      </div>`;
  }

  function render() {
    const section = document.getElementById('gallery-section');
    const filtered = activeEventId === 'all'
      ? allPhotos
      : allPhotos.filter(p => p.tournament_id == activeEventId);

    if (filtered.length === 0) {
      section.innerHTML = `
        <div class="empty-state">
          <div class="icon">📸</div>
          <h3>No photos yet</h3>
          <p>Photos and videos from events will appear here as they are uploaded.</p>
        </div>`;
      return;
    }

    const groups = {};
    filtered.forEach(p => {
      const key = p.tournament_id || '__none__';
      if (!groups[key]) groups[key] = [];
      groups[key].push(p);
    });

    lightboxPhotos = filtered;

    section.innerHTML = Object.entries(groups)
      .map(([eventId, photos]) => renderEventSection(eventId, photos))
      .join('');

    section.querySelectorAll('.photo-item').forEach((item, i) => {
      item.style.animationDelay = (i % SHOW_LIMIT) * 0.03 + 's';
      item.addEventListener('click', () => openLightbox(+item.dataset.index));
    });

    section.querySelectorAll('[data-expand]').forEach(btn => {
      btn.addEventListener('click', () => {
        expandedEvents.add(btn.dataset.expand);
        render();
      });
    });

    setupVideoAutoplay();
  }

  // Lazy-load + autoplay-in-view for video tiles, muted, pauses off-screen
  function setupVideoAutoplay() {
    const videos = document.querySelectorAll('.photo-item video[data-src]');
    if (!('IntersectionObserver' in window)) {
      videos.forEach(v => { v.src = v.dataset.src; });
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const v = entry.target;
        if (entry.isIntersecting) {
          if (!v.src) v.src = v.dataset.src;
          v.play().catch(() => {});
        } else {
          v.pause();
        }
      });
    }, { threshold: 0.4 });
    videos.forEach(v => io.observe(v));
  }

  function renderError() {
    document.getElementById('gallery-section').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <h3>Couldn't load gallery</h3>
        <p>Check your Supabase credentials.</p>
      </div>`;
  }

  // ─── LIGHTBOX ─────────────────────────────────────────────
  function openLightbox(index) {
    lightboxIndex = index;
    showLightboxPhoto();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLightboxPhoto() {
    const p = lightboxPhotos[lightboxIndex];
    if (!p) return;
    const isVideo = p.media_type === 'video';
    document.getElementById('lb-media').innerHTML = isVideo
      ? `<video src="${p.image_url}" controls autoplay playsinline></video>`
      : `<img src="${p.image_url}" alt=""/>`;
    document.getElementById('lb-caption').textContent = p.caption || '';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('lb-media').innerHTML = ''; // stop any playing video
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', () => {
    lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
    showLightboxPhoto();
  });
  document.getElementById('lb-next').addEventListener('click', () => {
    lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
    showLightboxPhoto();
  });
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') document.getElementById('lb-prev').click();
    if (e.key === 'ArrowRight') document.getElementById('lb-next').click();
  });

  loadGallery();
</script>

<script>
(function() {
  let appCurrent = 0;
  const appSlides = document.querySelectorAll('#appSlider .app-slide');
  const appDotsEl = document.getElementById('appDots');
  appSlides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'app-dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => appGoTo(i);
    appDotsEl.appendChild(dot);
  });
  window.appSlide = function(dir) {
    appGoTo((appCurrent + dir + appSlides.length) % appSlides.length);
  };
  function appGoTo(i) {
    appSlides[appCurrent].classList.remove('active');
    appDotsEl.children[appCurrent].classList.remove('active');
    appCurrent = i;
    appSlides[appCurrent].classList.add('active');
    appDotsEl.children[appCurrent].classList.add('active');
  }
})();
</script>
<div class="scroll-progress" id="scroll-progress"></div>
<script>
  (function(){
    const currentPage = location.pathname.split('/').filter(Boolean).pop() || 'index.html';
    const normalizeHref = href => (href || '')
      .split(/[?#]/)[0]
      .split('/')
      .filter(Boolean)
      .pop() || 'index.html';

    document.querySelectorAll('.navlinks a').forEach(a => {
      if (normalizeHref(a.getAttribute('href')) === currentPage) {
        a.classList.add('active');
      }
    });
  })();

  const navEl = document.querySelector('nav');
  const progressEl = document.getElementById('scroll-progress');
  if (navEl && progressEl) {
    let ticking = false;
    const updateProgress = () => {
      const y = window.scrollY;
      navEl.classList.toggle('scrolled', y > 30);
      const max = document.documentElement.scrollHeight - window.innerHeight;
      progressEl.style.width = max > 0 ? `${Math.min(100, Math.round((y / max) * 10000) / 100)}%` : '0%';
      progressEl.style.opacity = max > 0 ? '1' : '0';
      ticking = false;
    };
    const onScroll = () => {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(updateProgress);
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    updateProgress();
  }
</script>
