function qr(url){const g=qrcode(0,"M");g.addData(url);g.make();const n=g.getModuleCount(),z=8,c=document.createElement("canvas");c.width=c.height=n*z;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#0d1726";for(let r=0;r<n;r++)for(let i=0;i<n;i++)if(g.isDark(r,i))x.fillRect(i*z,r*z,z,z);return c.toDataURL("image/png")}
function scoreOf(m){const P=[["entry1_score","entry2_score"],["score1","score2"],["entry1_points","entry2_points"],["player1_score","player2_score"],["score_a","score_b"],["team1_score","team2_score"],["entry1_games","entry2_games"]];let a=null,b=null,sets="";for(const[x,y]of P){if(m[x]!=null&&m[y]!=null){a=m[x];b=m[y];break}}
let s=m.scores??m.sets??m.set_scores;if(typeof s==="string"){try{s=JSON.parse(s)}catch(e){sets=s;s=null}}

async function view(){const F="id,name,status,venue,start_date,end_date";let r=await sb.from("tournaments").select(F).eq("slug",q).maybeSingle();if(!r.data)r=await sb.from("tournaments").select(F).eq("id",q).maybeSingle();const t=r.data;

document.getElementById("wst").innerHTML=[["Live now",n("live")],["Played",n("done")],["Matches",all.length],["Categories",cs.length]].map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join("");
document.getElementById("tb").innerHTML=[["all","All"],["live","Live"],["soon","Upcoming"],["done","Finished"]].map(([v,l])=>`<button class="${f==v?"on":""}" data-f="${v}">${l}</button>`).join("");
document.getElementById("cc").innerHTML=cs.length>1?[["all","All categories"],...cs.map(c=>[c.id,c.name])].map(([v,l])=>`<button class="${String(cat)==String(v)?"on":""}" data-c="${v}">${E(l)}</button>`).join(""):"";
const O={live:0,soon:1,done:2},L=all.filter(x=>(f=="all"||x.s==f)&&(cat=="all"||String(x.m.category_id)==String(cat))&&(!term||(nm(x.m.entry1_id)+" "+nm(x.m.entry2_id)).toLowerCase().includes(term))).sort((a,b)=>O[a.s]-O[b.s]||String(a.m.round).localeCompare(String(b.m.round),undefined,{numeric:true}));
const cn=id=>(cs.find(c=>String(c.id)==String(id))||{}).name||"",row=(id,w,sc)=>`<div class="pl${w?" w":""}"><span>${E(nm(id))}${w?" <em>&#10003;</em>":""}</span><b>${sc??""}</b></div>`;
document.getElementById("m").innerHTML=L.length?`<div class="mg">${L.map(({m,s,sc})=>{const rd=m.round==null||m.round===""?"":isNaN(m.round)?E(m.round):"Round "+E(m.round);return`<article class="mc ${s}"><header><span>${[cn(m.category_id)&&E(cn(m.category_id)),rd,m.court&&"Court "+E(m.court)].filter(Boolean).join(" &middot; ")}</span><span class="bd ${s}">${s=="live"?"Live":s=="done"?"Final":"Next"}</span></header>${row(m.entry1_id,m.winner_entry_id&&m.winner_entry_id==m.entry1_id,sc.a)}${row(m.entry2_id,m.winner_entry_id&&m.winner_entry_id==m.entry2_id,sc.b)}${sc.sets?`<div class="ms">${E(sc.sets)}</div>`:""}</article>`}).join("")}</div>`:'<p class="note">'+(all.length?"No matches match your filter.":"Matches will appear here when the draw is ready.")+"</p>"}
async function load(){const{data:cs}=await sb.from("categories").select("id,name").eq("tournament_id",t.id);D.cs=cs||[];const ids=D.cs.map(c=>c.id);let ms=[];if(ids.length){const x=await sb.from("matches").select("*").in("category_id",ids);ms=x.data||[]}D.ms=ms;
const eid=[...new Set(ms.flatMap(m=>[m.entry1_id,m.entry2_id]).filter(Boolean))];if(eid.length){const{data:es}=await sb.from("category_entries").select("id,players(full_name)").in("id",eid);(es||[]).forEach(e=>D.N[e.id]=e.players&&e.players.full_name||"TBD")}

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.f){f=b.dataset.f;draw()}else if(b.dataset.c){cat=b.dataset.c;draw()}else if(b.id=="qb"){const m=document.getElementById("qm");m.hidden=!m.hidden}else if(b.id=="sh"){if(navigator.share)navigator.share({title:t.name,url}).catch(()=>{});else{try{navigator.clipboard.writeText(url);b.textContent="Link copied"}catch(x){}}}});
