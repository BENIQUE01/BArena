<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Banana Smash S04</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../assets/css/base.css"/>
  <link rel="stylesheet" href="../../assets/css/s04admin.css"/>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-brand">BAR<span>ENA</span></div>
      <div class="login-sub">Banana Smash S04 · Admin</div>
      <div class="login-error" id="login-error"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn-login" id="login-btn">Sign In</button>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-screen" style="display:none;">

    <nav>
      <div class="brand">BAR<span>ENA</span> <span class="admin-tag">ADMIN</span></div>
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <div class="navlinks">
        <a href="index.html">← Back to S04</a>
        <a href="../index.html">KITTA Hub</a>
      </div>
      <button class="nav-cta" id="logout-btn">Sign Out</button>
      <label for="nav-toggle" class="nav-burger"><span></span><span></span><span></span></label>
      <label for="nav-toggle" class="nav-scrim"></label>
    </nav>

    <div class="admin-wrap">

      <!-- HEADER -->
      <div class="admin-header">
        <div>
          <div class="admin-eyebrow">Banana Smash S04 · Aug 22–23, 2026</div>
          <h1 class="admin-title">Registration Dashboard</h1>
        </div>
        <div class="admin-actions">
          <button class="act-btn" id="refresh-btn">↻ Refresh</button>
          <button class="act-btn primary" id="export-btn">⬇ Export CSV</button>
        </div>
      </div>

      <!-- SUMMARY CARDS -->
      <div class="summary-grid">
        <div class="summary-card">
          <div class="sc-num" id="s-total">—</div>
          <div class="sc-lab">Total Entries</div>
        </div>
        <div class="summary-card">
          <div class="sc-num" id="s-confirmed">—</div>
          <div class="sc-lab">Confirmed</div>
        </div>
        <div class="summary-card">
          <div class="sc-num" id="s-pending">—</div>
          <div class="sc-lab">Pending Payment</div>
        </div>
        <div class="summary-card">
          <div class="sc-num" id="s-junior">—</div>
          <div class="sc-lab">Juniors</div>
        </div>
        <div class="summary-card">
          <div class="sc-num" id="s-men">—</div>
          <div class="sc-lab">Senior Men</div>
        </div>
        <div class="summary-card">
          <div class="sc-num" id="s-ladies">—</div>
          <div class="sc-lab">Senior Ladies</div>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="filters">
        <select id="filter-cat">
          <option value="">All Categories</option>
          <option value="a6843ff0-0643-4328-800c-f27065e8df4d">Juniors</option>
          <option value="6b34289d-b1e9-4700-bb39-fc109573147b">Senior Men</option>
          <option value="9bc6d79a-f673-46e0-930c-484c0bb0d974">Senior Ladies</option>
        </select>
        <select id="filter-status">
          <option value="">All Statuses</option>
          <option value="confirmed">Confirmed</option>
          <option value="pending">Pending</option>
        </select>
        <input type="text" id="filter-search" placeholder="Search name or phone…"/>
      </div>

      <!-- TABLE -->
      <div class="table-wrap">
        <table id="reg-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Category</th>
              <th>M-Pesa Code</th>
              <th>Status</th>
              <th>Registered</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="reg-tbody">
            <tr><td colspan="8" class="loading-row">Loading registrations…</td></tr>
          </tbody>
        </table>
      </div>

    </div><!-- /admin-wrap -->

  </div><!-- /admin-screen -->

  <!-- TOAST -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    const SUPABASE_URL     = 'https://xtbvzdupauxuxchhmshd.supabase.co';
    const SUPABASE_ANON    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0YnZ6ZHVwYXV4dXhjaGhtc2hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzA0ODgsImV4cCI6MjA5MzcwNjQ4OH0.M9nqtyVj0YCH1v3P0cJ2OfHBHyH4tn0BReNDWWalTlo';
    const ADMIN_EMAIL      = 'bernardnjuguna500@gmail.com';
    const CATEGORY_IDS     = {
      junior: 'a6843ff0-0643-4328-800c-f27065e8df4d',
      men:    '6b34289d-b1e9-4700-bb39-fc109573147b',
      ladies: '9bc6d79a-f673-46e0-930c-484c0bb0d974'
    };
    const CAT_NAMES = {
      [CATEGORY_IDS.junior]: 'Juniors',
      [CATEGORY_IDS.men]:    'Senior Men',
      [CATEGORY_IDS.ladies]: 'Senior Ladies',
    };

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    let allRows = [];

    // ── AUTH ──────────────────────────────────────────────
    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user.email === ADMIN_EMAIL) {
        showDashboard();
      }
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl    = document.getElementById('login-error');
      const btn      = document.getElementById('login-btn');

      btn.textContent = 'Signing in…';
      btn.disabled = true;
      errEl.textContent = '';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = error.message;
        btn.textContent = 'Sign In';
        btn.disabled = false;
        return;
      }

      if (data.user.email !== ADMIN_EMAIL) {
        await sb.auth.signOut();
        errEl.textContent = 'Access denied — this page is for admins only.';
        btn.textContent = 'Sign In';
        btn.disabled = false;
        return;
      }

      showDashboard();
    });

    document.getElementById('login-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      document.getElementById('admin-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    });

    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      loadRegistrations();
    }

    // ── DATA ──────────────────────────────────────────────
    async function loadRegistrations() {
      document.getElementById('reg-tbody').innerHTML =
        '<tr><td colspan="8" class="loading-row">Loading…</td></tr>';

      const { data, error } = await sb
        .from('category_entries')
        .select('id, payment_status, mpesa_code, registered_at, category_id, players(full_name, phone)')
        .in('category_id', Object.values(CATEGORY_IDS))
        .order('registered_at', { ascending: false });

      if (error) {
        showToast('⚠️ Failed to load registrations');
        return;
      }

      allRows = data || [];
      updateSummary();
      renderTable();
    }

    function updateSummary() {
      const total     = allRows.length;
      const confirmed = allRows.filter(r => r.payment_status === 'confirmed').length;
      const pending   = allRows.filter(r => r.payment_status === 'pending').length;
      const junior    = allRows.filter(r => r.category_id === CATEGORY_IDS.junior).length;
      const men       = allRows.filter(r => r.category_id === CATEGORY_IDS.men).length;
      const ladies    = allRows.filter(r => r.category_id === CATEGORY_IDS.ladies).length;

      document.getElementById('s-total').textContent     = total;
      document.getElementById('s-confirmed').textContent = confirmed;
      document.getElementById('s-pending').textContent   = pending;
      document.getElementById('s-junior').textContent    = junior;
      document.getElementById('s-men').textContent       = men;
      document.getElementById('s-ladies').textContent    = ladies;
    }

    function renderTable() {
      const catFilter    = document.getElementById('filter-cat').value;
      const statusFilter = document.getElementById('filter-status').value;
      const search       = document.getElementById('filter-search').value.toLowerCase();

      const filtered = allRows.filter(r => {
        if (catFilter    && r.category_id    !== catFilter)    return false;
        if (statusFilter && r.payment_status !== statusFilter) return false;
        if (search) {
          const name  = r.players?.full_name?.toLowerCase() || '';
          const phone = r.players?.phone?.toLowerCase() || '';
          if (!name.includes(search) && !phone.includes(search)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        document.getElementById('reg-tbody').innerHTML =
          '<tr><td colspan="8" class="loading-row">No registrations match this filter.</td></tr>';
        return;
      }

      document.getElementById('reg-tbody').innerHTML = filtered.map((r, i) => {
        const name    = r.players?.full_name || '—';
        const phone   = r.players?.phone    || '—';
        const cat     = CAT_NAMES[r.category_id] || '—';
        const mpesa   = r.mpesa_code || '<span style="color:var(--text-dim)">—</span>';
        const status  = r.payment_status;
        const date    = new Date(r.registered_at).toLocaleDateString('en-KE', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
        const pillCls = status === 'confirmed' ? 'pill-confirmed' : 'pill-pending';
        const btnLabel = status === 'confirmed' ? 'Unconfirm' : 'Confirm ✓';
        const btnCls   = status === 'confirmed' ? 'act-row-btn unconfirm' : 'act-row-btn confirm';

        return `<tr>
          <td class="td-num">${i + 1}</td>
          <td class="td-name">${name}</td>
          <td class="td-phone">${phone}</td>
          <td>${cat}</td>
          <td class="td-mono">${mpesa}</td>
          <td><span class="status-pill ${pillCls}">${status}</span></td>
          <td class="td-date">${date}</td>
          <td><button class="${btnCls}" data-id="${r.id}" data-status="${status}">${btnLabel}</button></td>
        </tr>`;
      }).join('');

      // Attach confirm/unconfirm handlers
      document.querySelectorAll('.act-row-btn').forEach(btn => {
        btn.addEventListener('click', () => toggleStatus(btn.dataset.id, btn.dataset.status));
      });
    }

    async function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === 'confirmed' ? 'pending' : 'confirmed';
      const { error } = await sb
        .from('category_entries')
        .update({ payment_status: newStatus })
        .eq('id', id);

      if (error) { showToast('⚠️ Failed to update status'); return; }

      const row = allRows.find(r => r.id === id);
      if (row) row.payment_status = newStatus;
      updateSummary();
      renderTable();
      showToast(newStatus === 'confirmed' ? '✅ Player confirmed' : '↩ Moved back to pending');
    }

    // ── FILTERS ───────────────────────────────────────────
    ['filter-cat', 'filter-status', 'filter-search'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderTable);
    });

    document.getElementById('refresh-btn').addEventListener('click', loadRegistrations);

    // ── CSV EXPORT ────────────────────────────────────────
    document.getElementById('export-btn').addEventListener('click', () => {
      const catFilter    = document.getElementById('filter-cat').value;
      const statusFilter = document.getElementById('filter-status').value;

      const filtered = allRows.filter(r => {
        if (catFilter    && r.category_id    !== catFilter)    return false;
        if (statusFilter && r.payment_status !== statusFilter) return false;
        return true;
      });

      const headers = ['#', 'Full Name', 'Phone', 'Category', 'M-Pesa Code', 'Payment Status', 'Registered At'];
      const rows = filtered.map((r, i) => [
        i + 1,
        r.players?.full_name || '',
        r.players?.phone     || '',
        CAT_NAMES[r.category_id] || '',
        r.mpesa_code         || '',
        r.payment_status     || '',
        new Date(r.registered_at).toLocaleString('en-KE'),
      ]);

      const csv = [headers, ...rows]
        .map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csv], { type: 'text/csv' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `banana-smash-s04-registrations-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('⬇ CSV downloaded');
    });

    // ── TOAST ─────────────────────────────────────────────
    function showToast(message, duration = 3500) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('out');
        setTimeout(() => toast.remove(), 400);
      }, duration);
    }

    // ── INIT ──────────────────────────────────────────────
    checkSession();
  </script>

<div class="scroll-progress" id="scroll-progress"></div>
<script>
  // Active nav link — matches current page filename
  (function(){
    const path = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.navlinks a').forEach(a => {
      const href = a.getAttribute('href').split('/').pop();
      if (href === path) a.classList.add('active');
    });
  })();

  // Shrink nav + scroll progress bar
  const navEl = document.querySelector('nav');
  const progressEl = document.getElementById('scroll-progress');
  function onScroll(){
    const y = window.scrollY;
    navEl.classList.toggle('scrolled', y > 30);
    const max = document.documentElement.scrollHeight - window.innerHeight;
    progressEl.style.width = max > 0 ? (y / max * 100) + '%' : '0%';
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
</script></body>
</html>
